[project]
name = "lc-bot"
version = "0.1.0"
description = "Pure-Python bitboard chess engine with a switchable NNUE evaluation, UCI, and a Lichess bot."
authors = [
    { name = "Lucas Ciordas", email = "22lciordas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
# Only train.py needs torch; the engine itself runs on the standard library.
# Install with: uv sync --group train
train = [
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
