[project]
name = "final-engine"
version = "0.1.0"
description = "Pure-Python bitboard chess engine."
authors = [
    { name = "Lucas Ciordas", email = "22lciordas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "numba>=0.61.2",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
